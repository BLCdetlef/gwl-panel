<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Kompakte Rollen-Symbole für das GWL-Panel</title>
  <desc id="desc">Vier kleine Symbole für Kernbeitrag, Vertiefung mit Organbezug, Vertiefung ohne Organbezug und ergänzenden Kontext.</desc>
  <style>
    .bg{fill:#f7f7f4}.card{fill:#fff;stroke:#d6d7d2;stroke-width:2}.title{font:700 30px Arial,sans-serif;fill:#101a24}.sub{font:16px Arial,sans-serif;fill:#59636a}.small{font:700 13px Arial,sans-serif;letter-spacing:1.1px;fill:#487568}.label{font:700 20px Arial,sans-serif;fill:#101a24}.copy{font:15px Arial,sans-serif;fill:#59636a}.dark{fill:none;stroke:#283c4c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.muted{fill:none;stroke:#7d8991;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accent{fill:#dceae5;stroke:#487568;stroke-width:4}.node{fill:#fff;stroke:#283c4c;stroke-width:5}
  </style>
  <defs><clipPath id="organCircle"><circle cx="72" cy="72" r="43"/></clipPath></defs>
  <rect class="bg" width="1200" height="650"/>
  <text x="70" y="70" class="title">Vier Beitragsrollen · kompakter Vorschlag</text>
  <text x="70" y="102" class="sub">Gemeinsame Kreisform für beide Vertiefungen; nur der Inhalt unterscheidet Organbezug und allgemeinen Zusammenhang.</text>
  <g transform="translate(70 155)"><rect class="card" width="500" height="190" rx="20"/><text x="30" y="35" class="small">01 · PG-KERNBEITRAG</text><g transform="translate(50 47)"><circle class="node" cx="72" cy="72" r="53"/><path class="dark" d="M34 79H110M91 43V113"/><circle class="accent" cx="58" cy="79" r="10"/></g><text x="166" y="104" class="label">Zustand &amp; Grenze</text><text x="166" y="132" class="copy">Messpunkt an einer Grenzlinie</text></g>
  <g transform="translate(630 155)"><rect class="card" width="500" height="190" rx="20"/><text x="30" y="35" class="small">02 · VERTIEFUNG · MIT ORGANBEZUG</text><g transform="translate(50 47)"><circle class="node" cx="72" cy="72" r="53"/><image href="health/organ_respiratory.jpg" x="29" y="29" width="86" height="86" preserveAspectRatio="xMidYMid slice" clip-path="url(#organCircle)"/><circle class="dark" cx="72" cy="72" r="43"/></g><text x="166" y="104" class="label">Vertiefung mit Organbezug</text><text x="166" y="132" class="copy">Ein vorhandenes Bodymap-Organ</text></g>
  <g transform="translate(70 395)"><rect class="card" width="500" height="190" rx="20"/><text x="30" y="35" class="small">03 · VERTIEFUNG · OHNE ORGANBEZUG</text><g transform="translate(50 47)"><circle class="node" cx="72" cy="72" r="53"/><circle class="accent" cx="51" cy="72" r="9"/><circle class="node" cx="92" cy="53" r="9"/><circle class="node" cx="92" cy="91" r="9"/><path class="dark" d="M60 68L83 57M60 76L83 87"/></g><text x="166" y="104" class="label">Vertiefung ohne Organbezug</text><text x="166" y="132" class="copy">Zusammenhang bzw. Einflussnetz</text></g>
  <g transform="translate(630 395)"><rect class="card" width="500" height="190" rx="20"/><text x="30" y="35" class="small">04 · ERGÄNZENDER KONTEXT</text><g transform="translate(50 47)"><circle cx="72" cy="72" r="53" fill="none" stroke="#7d8991" stroke-width="5" stroke-dasharray="8 9"/><circle class="accent" cx="72" cy="72" r="17"/><path class="muted" d="M96 48h12M102 42v12"/></g><text x="166" y="104" class="label">Ergänzender Kontext</text><text x="166" y="132" class="copy">Einordnung außerhalb des PG-Kerns</text></g>
</svg>
